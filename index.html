<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech Fluency for Ecommerce Leaders</title>

  <!-- Content Security Policy: no unsafe-inline scripts; all JS in external files -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com;
                 style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
                 font-src 'self' https://fonts.gstatic.com;
                 img-src 'self' data: blob:;
                 connect-src 'none';
                 object-src 'none';
                 base-uri 'self'">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>

<!-- ══════════════════════════════════
     DASHBOARD (landing)
══════════════════════════════════ -->
<div id="dashboard">
  <header class="site-header" role="banner">
    <h1>Tech Fluency for Ecommerce Leaders</h1>
    <p>Active learning. Real decisions. 6 modules, 24 units, 6 problem sets.</p>

    <div class="overall-progress" role="region" aria-label="Overall progress">
      <label id="progressLabel">0 / 30 complete</label>
      <div class="progress-track" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-labelledby="progressLabel">
        <div class="progress-fill" id="overallFill" style="width:0%"></div>
      </div>
    </div>

    <button class="continue-btn" id="continueBtn" style="display:none" aria-label="Continue where you left off">
      Continue where you left off →
    </button>
  </header>

  <main>
    <div class="module-grid" id="moduleGrid" role="list" aria-label="Course modules">
      <!-- Module cards rendered by app.js -->
    </div>
  </main>

  <footer style="text-align:center;padding:40px 20px">
    <button id="resetBtn"
            style="background:none;border:1px solid #2a2a2a;color:#888;padding:8px 16px;border-radius:6px;cursor:pointer;font-family:'Space Mono',monospace;font-size:.75rem"
            aria-label="Reset all progress">
      Reset Progress
    </button>
  </footer>
</div>

<!-- ══════════════════════════════════
     APP SHELL (sidebar + unit/PS view)
══════════════════════════════════ -->
<div id="app-shell" role="application" aria-label="Course content">
  <nav class="sidebar" id="sidebar" role="navigation" aria-label="Module and unit navigation">
    <!-- Rendered by app.js -->
  </nav>

  <div id="contentArea" style="flex:1;overflow-y:auto">
    <!-- Rendered by app.js -->
  </div>
</div>

<!-- ══════════════════════════════════
     SCRIPTS (external only — required by CSP)
══════════════════════════════════ -->
<!-- Mermaid.js for architecture diagrams -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js" crossorigin="anonymous"></script>

<!-- Lesson content (existing data — trusted, bundled) -->
<script src="js/lessons-data.js"></script>

<!-- Module structure & curriculum -->
<script src="js/modules-data.js"></script>

<!-- Application logic -->
<script src="js/app.js"></script>

</body>
</html>
